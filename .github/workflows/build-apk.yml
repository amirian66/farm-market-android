name: Build Farm Market Android APK

on:
  push:
    branches: [main]
    paths:
      - 'FarmMarketAndroidSource.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source ZIP
        run: |
          test -f FarmMarketAndroidSource.zip
          unzip -t FarmMarketAndroid.zip 2>/dev/null || unzip -t FarmMarketAndroidSource.zip
          unzip -oq FarmMarketAndroidSource.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Build debug APK
        working-directory: farm_market_android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmMarketAndroid-debug-apk
          path: farm_market_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
