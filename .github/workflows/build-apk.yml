name: Build Farm Market Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'FarmMarketAndroidSource.zip.base64'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode and extract Android source
        run: |
          base64 --decode FarmMarketAndroidSource.zip.base64 > /tmp/FarmMarketAndroidSource.zip
          unzip -oq /tmp/FarmMarketAndroidSource.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: farm_market_android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farm-market-android-apk
          path: farm_market_android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
